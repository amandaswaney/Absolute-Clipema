name: Clip robot

# Makes clips. The app starts this straight away when someone makes a clip (if the quick start key is set),
# and it also checks every 10 minutes in case that start was missed.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

concurrency:
  group: clip-robot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_PUBLIC_URL: ${{ secrets.B2_PUBLIC_URL }}
      YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install robot
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Anything to do?
        id: peek
        working-directory: worker
        run: node src/robot.js --peek
      - name: Install ffmpeg and the newest yt-dlp
        if: steps.peek.outputs.work == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 -m pip install --quiet --upgrade --pre "yt-dlp[default]"
          yt-dlp --version
      - name: Make clips
        if: steps.peek.outputs.work == 'true'
        working-directory: worker
        run: node src/robot.js
