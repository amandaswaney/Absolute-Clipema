<!doctype html>
<html lang="en" data-theme="purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Absolute Clipema</title>
<meta name="description" content="Our group's clips and memes.">
<meta name="theme-color" content="#1E0636">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipema">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before anything draws, so there is no flash of the wrong colours.
  try { var t = localStorage.getItem('clipema-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="config.js"></script>
</head>
<body>
<div id="app"><div class="center-load"><img src="icons/icon-192.png" alt="Absolute Clipema"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
